name: SBOM + Dependency-Check (PR only)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          npm run sbom
          test -s sbom/bom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/bom.json
          retention-days: 7

      - name: Dependency-Check scan
        # Optional: add NVD_API_KEY in repository Secrets for faster/less rate-limited DB updates.
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p reports/dependency-check .cache/dependency-check
          docker run --rm             -e NVD_API_KEY="${NVD_API_KEY}"             -v "${PWD}:/src"             -v "${PWD}/.cache/dependency-check:/usr/share/dependency-check/data"             -w /src             owasp/dependency-check:latest             --scan .             --format "ALL"             --project "sbom-demo"             --out reports/dependency-check             --data /usr/share/dependency-check/data

      - name: Upload Dependency-Check reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: reports/dependency-check/
          retention-days: 7
